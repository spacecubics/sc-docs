name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Antora UI
        uses: actions/checkout@v7
        with:
          repository: spacecubics/sc-docs-ui
          ref: main
          path: sc-docs-ui

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Antora UI and full-document extension
        working-directory: sc-docs-ui
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm run build
          nix develop --command pnpm run bundle:mega

      - name: Install dependencies with the local extension
        run: npm install --no-save ./sc-docs-ui/build/sc-docs-mega.tgz

      - name: Print Node and Antora version
        run: |
          node --version
          npx antora --version
          npx wrangler --version

      - name: Generate Site
        run: npm run build -- --ui-bundle-url ./sc-docs-ui/build/ui-bundle.zip

      - name: Deploy to Cloudflare Pages
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
